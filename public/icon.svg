<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12263F"/>
      <stop offset="100%" stop-color="#081422"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for maskable safe zone -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="220" r="130" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35"/>

  <!-- Cross / Ray at the center top -->
  <path d="M256 120 L256 195 M235 145 L277 145" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Rays of light -->
  <path d="M205 130 L185 110 M307 130 L327 110 M256 85 L256 65" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Open Bible Pages -->
  <g transform="translate(0, 10)">
    <!-- Book spine base shadow -->
    <path d="M256 380 L256 220" stroke="#0B1A2C" stroke-width="6"/>
    
    <!-- Left page -->
    <path d="M256 225 C210 215 155 210 110 220 C105 221 100 226 100 232 L100 350 C100 356 105 361 112 360 C155 352 210 355 256 375 Z" 
          fill="#F8F9FA" opacity="0.95"/>
    <path d="M256 225 C210 215 155 210 110 220 C105 221 100 226 100 232 L100 350" 
          fill="none" stroke="url(#gold)" stroke-width="3"/>
          
    <!-- Left page text lines -->
    <line x1="125" y1="250" x2="235" y2="245" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="125" y1="272" x2="235" y2="267" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="125" y1="294" x2="235" y2="289" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="125" y1="316" x2="210" y2="311" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Right page -->
    <path d="M256 225 C302 215 357 210 402 220 C407 221 412 226 412 232 L412 350 C412 356 407 361 400 360 C357 352 302 355 256 375 Z" 
          fill="#FFFFFF"/>
    <path d="M256 225 C302 215 357 210 402 220 C407 221 412 226 412 232 L412 350" 
          fill="none" stroke="url(#gold)" stroke-width="3"/>

    <!-- Right page text lines / musical melody notation hints -->
    <line x1="277" y1="245" x2="387" y2="250" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="277" y1="267" x2="387" y2="272" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="277" y1="289" x2="387" y2="294" stroke="#12263F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    
    <!-- Music note on right page (Chants d'espérance symbol) -->
    <path d="M340 325 C340 332 333 337 325 337 C317 337 312 332 312 326 C312 320 318 316 327 316 L327 296 L355 290 L355 318" 
          fill="#C9A227"/>
    <circle cx="323" cy="327" r="7" fill="#C9A227"/>
    <circle cx="351" cy="320" r="7" fill="#C9A227"/>
    <path d="M327 296 L355 290 L355 298 L327 304 Z" fill="#C9A227"/>

    <!-- Bookmark ribbon -->
    <path d="M256 225 L256 395 L266 385 L276 395 L276 228" fill="url(#gold)"/>
  </g>

  <!-- App Label Arc or subtitle -->
  <text x="256" y="445" text-anchor="middle" font-family="'Cinzel', serif, sans-serif" font-weight="700" font-size="34" fill="#F8F9FA" letter-spacing="4">
    JERE KRETYEN
  </text>
  <text x="256" y="475" text-anchor="middle" font-family="'Lora', serif, sans-serif" font-style="italic" font-size="16" fill="#C9A227" letter-spacing="1">
    Chante &amp; vis la Parole
  </text>
</svg>
